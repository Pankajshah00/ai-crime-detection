<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>AI Suspicious Activity Detection</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.6.1/socket.io.min.js"></script>
<style>
  :root { --bg:#0a0c10; --panel:#111318; --border:#1e2230; --accent:#00e5ff; --danger:#ff3b3b; --warn:#ffaa00; --ok:#00e676; --text:#c8d0e0; --dim:#4a5270; --header-h:52px; }
  *,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:Arial,sans-serif; background:var(--bg); color:var(--text); height:100vh; display:flex; flex-direction:column; overflow:hidden; }
  header { height:var(--header-h); background:var(--panel); border-bottom:1px solid var(--border); display:flex; align-items:center; padding:0 20px; gap:14px; flex-shrink:0; }
  .logo-icon { width:28px;height:28px;background:var(--accent);border-radius:50%;display:grid;place-items:center;font-size:13px;color:var(--bg);font-weight:700; }
  header h1 { font-size:15px;font-weight:600;letter-spacing:.04em;color:#fff;flex:1; }
  .live-badge { font-size:10px;background:var(--danger);color:#fff;padding:2px 8px;border-radius:3px; }
  .stream-status { font-size:11px;color:var(--dim);display:flex;align-items:center;gap:6px; }
  .stream-status .dot { width:8px;height:8px;border-radius:50%;background:var(--dim); }
  .stream-status.active .dot { background:var(--ok); }
  .stream-status.active { color:var(--ok); }
  .main { flex:1;display:grid;grid-template-columns:1fr 280px;min-height:0; }
  .video-panel { background:#000;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;min-height:0; }
  .video-wrapper { position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center; }
  #videoFeed { max-width:100%;max-height:100%;width:100%;height:100%;object-fit:contain;display:block; }
  .video-placeholder { position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:var(--dim);font-size:13px; }
  .toolbar { position:absolute;top:10px;left:50%;transform:translateX(-50%);display:flex;gap:8px;z-index:4; }
  .btn { font-size:11px;font-weight:600;padding:7px 14px;border-radius:4px;border:1px solid var(--border);background:rgba(17,19,24,.92);color:var(--text);cursor:pointer; }
  .btn:hover { border-color:var(--accent);color:var(--accent); }
  .btn.primary { border-color:var(--accent);color:var(--accent); }
  .btn.danger-btn { border-color:var(--danger);color:var(--danger); }
  #fileInput { display:none; }
  .status-message { position:absolute;left:50%;bottom:18px;transform:translateX(-50%);z-index:5;background:rgba(17,19,24,.94);border:1px solid var(--border);padding:8px 14px;border-radius:5px;font-size:11px;display:none;max-width:80%;text-align:center; }
  .motion-bar-wrap { position:absolute;bottom:0;left:0;right:0;z-index:3;height:4px;background:rgba(255,255,255,.06); }
  .motion-bar { height:100%;width:0%;background:linear-gradient(90deg,var(--ok),var(--warn),var(--danger)); }
  .flash { position:absolute;inset:0;z-index:5;background:rgba(255,0,0,.18);pointer-events:none; }
  .sidebar { background:var(--panel);border-left:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden; }
  .stats-section { padding:16px;border-bottom:1px solid var(--border); }
  .stats-label,.alert-header span { font-size:10px;letter-spacing:.12em;color:var(--dim); }
  .stats-grid { display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px; }
  .stat-card { background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:10px 12px;text-align:center; }
  .stat-value { font-size:22px;color:var(--accent);line-height:1; }
  .stat-value.danger { color:var(--danger); } .stat-value.warn { color:var(--warn); }
  .stat-label { font-size:10px;color:var(--dim);margin-top:4px; }
  .alert-section { flex:1;display:flex;flex-direction:column;overflow:hidden; }
  .alert-header { padding:12px 16px 10px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border); }
  .clear-btn { font-size:10px;color:var(--dim);cursor:pointer;background:none;border:none; }
  .alert-list { flex:1;overflow-y:auto;padding:8px 0; }
  .alert-item { padding:8px 16px;border-bottom:1px solid rgba(30,34,48,.6);display:flex;gap:10px;align-items:flex-start; }
  .alert-icon { width:24px;height:24px;border-radius:4px;display:grid;place-items:center;font-size:11px;flex-shrink:0; }
  .alert-icon.weapon,.alert-icon.fight { background:rgba(255,59,59,.15);color:var(--danger);border:1px solid rgba(255,59,59,.3); }
  .alert-icon.loiter,.alert-icon.motion { background:rgba(255,170,0,.12);color:var(--warn);border:1px solid rgba(255,170,0,.25); }
  .alert-icon.crowd { background:rgba(0,229,255,.10);color:var(--accent);border:1px solid rgba(0,229,255,.2); }
  .alert-body { flex:1;min-width:0; }.alert-type{font-size:12px;font-weight:600;}.alert-type.danger{color:var(--danger)}.alert-type.warn{color:var(--warn)}.alert-type.info{color:var(--accent)}.alert-sub{font-size:10px;color:var(--dim);margin-top:2px}.alert-time{font-size:10px;color:var(--dim);flex-shrink:0}
</style>
</head>
<body>
<header><div class="logo-icon">👁</div><h1>AI Suspicious Activity Detection <span class="live-badge">LIVE</span></h1><div class="stream-status" id="streamStatus"><div class="dot"></div><span>Idle</span></div></header>
<div class="main">
  <div class="video-panel" id="videoPanel">
    <div class="toolbar">
      <button class="btn primary" onclick="switchCamera()">📷 Live Camera</button>
      <button class="btn" onclick="document.getElementById('fileInput').click()">📂 Upload Video</button>
      <button class="btn danger-btn" onclick="stopStream()">⏹ Stop</button>
      <input type="file" id="fileInput" accept="video/*" onchange="uploadVideo(this)"/>
    </div>
    <div class="video-wrapper">
      <div class="video-placeholder" id="placeholder"><span style="font-size:42px">▶</span><span id="placeholderText">No stream — select a source above</span></div>
      <img id="videoFeed" src="" alt="Processed video" style="display:none;"/>
    </div>
    <div class="status-message" id="statusMessage"></div>
    <div class="motion-bar-wrap"><div class="motion-bar" id="motionBar"></div></div>
  </div>
  <div class="sidebar">
    <div class="stats-section"><div class="stats-label">STATISTICS</div><div class="stats-grid">
      <div class="stat-card"><div class="stat-value" id="statPersons">0</div><div class="stat-label">Persons</div></div>
      <div class="stat-card"><div class="stat-value danger" id="statWeapons">0</div><div class="stat-label">Weapons</div></div>
      <div class="stat-card"><div class="stat-value" id="statAlerts">0</div><div class="stat-label">Alerts</div></div>
      <div class="stat-card"><div class="stat-value warn" id="statMotion">0%</div><div class="stat-label">Motion</div></div>
    </div></div>
    <div class="alert-section"><div class="alert-header"><span>ALERT LOG</span><button class="clear-btn" onclick="clearAlerts()">Clear</button></div><div class="alert-list" id="alertList"></div></div>
  </div>
</div>
<script>
  var socket = io();
  var alertCount = 0;
  var streamStatus = document.getElementById('streamStatus');
  var feed = document.getElementById('videoFeed');
  var placeholder = document.getElementById('placeholder');
  var placeholderText = document.getElementById('placeholderText');
  var motionBar = document.getElementById('motionBar');
  var statMotion = document.getElementById('statMotion');
  var alertList = document.getElementById('alertList');
  var statAlerts = document.getElementById('statAlerts');
  var statusMessage = document.getElementById('statusMessage');

  function showStatus(message, error) {
    statusMessage.textContent = message || '';
    statusMessage.style.display = message ? 'block' : 'none';
    statusMessage.style.color = error ? '#ff6b6b' : '#00e676';
    if (message && !error) setTimeout(function(){ statusMessage.style.display='none'; }, 4000);
  }
  function setStreaming(on) {
    streamStatus.className='stream-status'+(on?' active':'');
    streamStatus.querySelector('span').textContent=on?'Streaming':'Idle';
  }
  socket.on('connect_error', function(err){ showStatus('Socket connection failed: '+err.message,true); });
  socket.on('frame', function(data){ feed.style.display='block'; placeholder.style.display='none'; setStreaming(true); showStatus(''); feed.src=data.image; });
  socket.on('stopped', function(){ feed.style.display='none'; placeholder.style.display='flex'; setStreaming(false); motionBar.style.width='0%'; });
  socket.on('stats', function(data){ document.getElementById('statPersons').textContent=data.persons||0; document.getElementById('statWeapons').textContent=data.weapons||0; var m=parseFloat(data.motion)||0; statMotion.textContent=m.toFixed(1)+'%'; motionBar.style.width=Math.min(m,100)+'%'; });
  var ALERT_CONFIG={'weapon_detected':{icon:'🔫',logCls:'weapon',textCls:'danger',label:'Weapon Detected'},'Weapon Detected':{icon:'🔫',logCls:'weapon',textCls:'danger',label:'Weapon Detected'},'weapon':{icon:'🔫',logCls:'weapon',textCls:'danger',label:'Weapon Detected'},'fighting':{icon:'⚡',logCls:'fight',textCls:'danger',label:'Fighting Detected'},'high_motion':{icon:'⚡',logCls:'motion',textCls:'warn',label:'High Motion'},'crowd_surge':{icon:'📈',logCls:'crowd',textCls:'warn',label:'Crowd Surge'},'crowd':{icon:'👥',logCls:'crowd',textCls:'info',label:'Crowd Detected'},'loitering':{icon:'⏱',logCls:'loiter',textCls:'warn',label:'Loitering'},'Loitering':{icon:'⏱',logCls:'loiter',textCls:'warn',label:'Loitering'},'running_detected':{icon:'🏃',logCls:'motion',textCls:'warn',label:'Running / Panic'}};
  socket.on('alert', function(data){ alertCount++;statAlerts.textContent=alertCount; var type=data.type||'Alert';var cfg=ALERT_CONFIG[type]||{icon:'ℹ',logCls:'crowd',textCls:'info',label:type};var sub='';if(data.class)sub+=data.class;if(data.track_id)sub+=(sub?' · ':'')+'Track #'+data.track_id;if(data.motion)sub+=(sub?' · ':'')+data.motion;if(data.duration)sub+=(sub?' · ':'')+data.duration+'s';var item=document.createElement('div');item.className='alert-item';item.innerHTML='<div class="alert-icon '+cfg.logCls+'">'+cfg.icon+'</div><div class="alert-body"><div class="alert-type '+cfg.textCls+'">'+cfg.label+'</div>'+(sub?'<div class="alert-sub">'+sub+'</div>':'')+'</div><div class="alert-time">'+new Date().toLocaleTimeString('en-GB')+'</div>';alertList.insertBefore(item,alertList.firstChild);while(alertList.children.length>150)alertList.removeChild(alertList.lastChild); });
  function clearAlerts(){alertList.innerHTML='';alertCount=0;statAlerts.textContent='0';}
  async function switchCamera(){
    showStatus('Trying to access server-side camera...',false);
    try {
      const r=await fetch('/switch_to_camera',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({camera_id:0})});
      const d=await r.json();
      if(!r.ok || !d.success){ showStatus('Live Camera is unavailable on cloud deployment. Use Upload Video.',true); return; }
      showStatus(d.message||'Camera started');
    } catch(e){ showStatus('Camera request failed. Use Upload Video on Render.',true); }
  }
  async function uploadVideo(input){
    if(!input.files.length)return;
    var file=input.files[0];
    showStatus('Uploading '+file.name+'...',false);
    var fd=new FormData();fd.append('video',file);
    try {
      const r=await fetch('/upload_video',{method:'POST',body:fd});
      const text=await r.text();
      let d={}; try{d=JSON.parse(text);}catch(_){ }
      if(!r.ok || !d.success){ showStatus('Upload failed: '+(d.message||text||('HTTP '+r.status)),true); return; }
      showStatus(d.message||'Video uploaded. Processing...');
      placeholderText.textContent='Processing uploaded video...';
    } catch(e){ showStatus('Upload request failed: '+e.message,true); }
    finally { input.value=''; }
  }
  async function stopStream(){try{await fetch('/stop_stream',{method:'POST'});showStatus('Stream stopped');}catch(e){showStatus('Stop failed: '+e.message,true);}}
</script>
</body>
</html>
